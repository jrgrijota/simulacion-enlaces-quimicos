<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Enlaces Químicos</title>
    <script src="js/i18n-en.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/vendor/p5.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="js/estadisticas.js" data-sim="sim-enlaces-quimicos"></script>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-inner">

            <div class="sim-header">
                <div class="sim-logo">⚗</div>
                <div>
                    <div class="sim-title">Laboratorio de Enlaces</div>
                    <div class="sim-subtitle">Modelo de Bohr · Enlace Iónico</div>
                </div>
            </div>

            <div class="card mode-card">
                <select id="mode-select">
                    <option value="IONIC">Enlace Iónico</option>
                    <option value="COVALENT">Enlace Covalente</option>
                    <option value="METALLIC">Enlace Metálico</option>
                </select>
            </div>

            <div class="card is-expanded" id="mode-info-card">
                <button class="card-trigger">Descripción <span class="card-chevron">▼</span></button>
                <div class="card-body" id="mode-info-wrapper">
                    <div class="info-section" id="mode-info-content"></div>
                    <div id="mode-info" class="info-section"></div>
                </div>
            </div>

            <div style="padding: 0 2px;">
                <button id="pause-btn" onclick="togglePause()" style="width:100%; font-size:12px; padding: 7px 10px;">⏸ Pausar</button>
            </div>

            <div id="ui-overlay"></div>

        </div>
    </aside>

    <div id="canvas-holder">
        <div id="sim-frame"></div>
        <div id="atom-controls-row">
            <div id="ctrl-0" class="atom-ctrl"></div>
            <div id="bond-01" class="bond-connector" style="display:none"></div>
            <div id="ctrl-1" class="atom-ctrl"></div>
            <div id="bond-12" class="bond-connector" style="display:none"></div>
            <div id="ctrl-2" class="atom-ctrl"></div>
        </div>
    </div>

    <script src="js/crystal-structures.js"></script>
    <script src="js/crystal-shear.js"></script>
    <script src="js/covalent-crystals.js"></script>
    <script src="js/crystal-3d.js"></script>
    <script src="js/covalent-crystal-mode.js"></script>
    <script src="js/sketch.js"></script>
    <script>
        document.querySelectorAll('.card-trigger').forEach(btn => {
            btn.addEventListener('click', () => btn.closest('.card').classList.toggle('is-expanded'));
        });
    </script>
</body>
</html>
